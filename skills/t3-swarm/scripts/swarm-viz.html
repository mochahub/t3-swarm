<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Swarm Live</title>
<style>
/* Card graph of a T3 swarm. No dependencies: pan/zoom, edges, minimap and inspector are all here.
   Visual language follows React Flow's defaults (dotted canvas, 1px cards with side handles,
   bezier edges, dashed animated edges for live links, stacked zoom controls). */
:root{
  --bg:#141414;--dots:#3a3a3a;--panel:#1b1b1b;--panel-line:#2c2c2c;--card:#1e1e1e;--line:#343434;--line-hi:#4b4b4b;
  --fg:#ededed;--mute:#9b9b9b;--faint:#666;--edge:#3e3e3e;--edge-live:#5c5c5c;--edge-hi:#8a8a8a;--handle:#bebebe;
  --ctrl:#2b2b2b;--ctrl-hover:#3e3e3e;--ctrl-line:#5b5b5b;
  --work:#5aa9ff;--deleg:#b48cff;--wait:#f2b84b;--done:#4cc38a;--fail:#ff6b6b;--idle:#6b7684;
  --brief:#5aa9ff;--msg:#b48cff;--result:#4cc38a;--failure:#ff6b6b;--poll:#6b7684;--prompt:#f2b84b;--reply:#f2b84b;
  --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,monospace;
  --sans:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
  color-scheme:dark}
@media (prefers-color-scheme: light){:root{
  --bg:#fafafa;--dots:#c4c4cc;--panel:#fff;--panel-line:#e6e6ea;--card:#fff;--line:#dcdce2;--line-hi:#b8b8c2;
  --fg:#1a192b;--mute:#5d6070;--faint:#9a9cab;--edge:#b1b1b7;--edge-live:#8c8c96;--edge-hi:#555;--handle:#1a192b;
  --ctrl:#fefefe;--ctrl-hover:#f4f4f4;--ctrl-line:#eee;
  --work:#1f7ae0;--deleg:#7c4dde;--wait:#b7790f;--done:#1f9d63;--fail:#d64545;--idle:#8a94a3;
  --brief:#1f7ae0;--msg:#7c4dde;--result:#1f9d63;--failure:#d64545;--poll:#9aa3af;--prompt:#b7790f;--reply:#b7790f;
  color-scheme:light}}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font:13px/1.4 var(--sans);-webkit-font-smoothing:antialiased;overflow:hidden}
#flow{position:fixed;inset:0;overflow:hidden;cursor:grab;touch-action:none;user-select:none;transition:right .25s ease}
#flow.panning{cursor:grabbing}
body.inspecting #flow{right:380px}
#vp{position:absolute;left:0;top:0;transform-origin:0 0}
#edges{position:absolute;left:0;top:0;width:1px;height:1px;overflow:visible;pointer-events:none}
.edge{fill:none;stroke:var(--edge);stroke-width:1}
.edge.live{stroke:var(--edge-live);stroke-dasharray:5;animation:dashdraw .5s linear infinite}
.edge.hl{stroke:var(--edge-hi);stroke-width:1.5}
.edge.plan{stroke-dasharray:2 4}
.edge.peer{stroke:var(--msg);stroke-width:1.25;stroke-dasharray:4 3;opacity:.9}
@keyframes dashdraw{from{stroke-dashoffset:10}}
.fx-dot{pointer-events:none}

/* cards */
.node{position:absolute;left:0;top:0;width:248px;height:64px;background:var(--card);border:1px solid var(--line);border-radius:8px;
  padding:8px 10px;cursor:pointer;transition:border-color .2s,box-shadow .2s,opacity .3s}
.node:hover{border-color:var(--line-hi);box-shadow:0 1px 4px 1px rgba(0,0,0,.18)}
.node.sel{box-shadow:0 0 0 1px var(--edge-hi);border-color:var(--edge-hi)}
.node:focus-visible{outline:2px solid var(--work);outline-offset:2px}
.node .h{position:absolute;top:50%;width:6px;height:6px;margin-top:-3px;border-radius:50%;background:var(--handle);border:1px solid var(--card)}
.node .h.l{left:-4px}.node .h.r{right:-4px}
.node .top{display:flex;gap:6px;align-items:center;min-width:0}
.node .dot{flex:none;width:7px;height:7px;border-radius:50%;background:var(--idle)}
.node .name{font-weight:600;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:1}
.node .where{flex:none;font:10px var(--mono);color:var(--mute);border:1px dashed var(--line-hi);border-radius:4px;padding:0 4px}
.node .meta{font:10.5px/1.5 var(--mono);color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:3px}
.node .act{font:11px/1.5 var(--mono);color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.node .act b{font-weight:500;color:var(--fg)}
.role{font:9.5px/1.5 var(--mono);text-transform:uppercase;letter-spacing:.04em;padding:0 5px;border-radius:4px;border:1px solid var(--line);color:var(--mute);flex:none}
.role.lead{color:var(--deleg);border-color:color-mix(in srgb,var(--deleg) 40%,var(--line))}
.role.coordinator{color:var(--prompt);border-color:color-mix(in srgb,var(--prompt) 40%,var(--line))}
.role.worker{color:var(--work);border-color:color-mix(in srgb,var(--work) 40%,var(--line))}
.node.working{border-color:color-mix(in srgb,var(--work) 55%,var(--line))}
.node.working .dot{background:var(--work);animation:blink 1.4s ease-in-out infinite}
.node.delegating .dot{background:var(--deleg)}.node.waiting .dot{background:var(--wait)}
.node.waiting{border-color:color-mix(in srgb,var(--wait) 55%,var(--line))}
.node.done .dot{background:var(--done)}.node.failed .dot{background:var(--fail)}
.node.failed{border-color:color-mix(in srgb,var(--fail) 55%,var(--line))}
.node.done{opacity:.8}
.node.plan{border-style:dashed;opacity:.6;cursor:default}
.node.group{border-style:dashed}
.node.group .stack{display:flex;gap:2px;flex:none}.node.group .stack i{width:6px;height:6px;border-radius:50%;background:var(--done)}
.node.group.plan .stack i{background:var(--idle)}
.node.less{height:30px;padding:6px 10px;border-style:dashed;color:var(--mute)}
.node.you{width:64px;height:32px;border-radius:999px;padding:0;display:grid;place-items:center;font-weight:600}
.node.future{opacity:.08!important}
.node.ping{box-shadow:0 0 0 3px color-mix(in srgb,var(--ping,var(--work)) 45%,transparent)}
.node.dim{opacity:.35}
@keyframes blink{50%{opacity:.35}}
/* zoomed far out: cards become status blocks */
.far .node{display:flex;align-items:center}
.far .node .meta,.far .node .act,.far .node .role,.far .node .where{display:none}
.far .node .top{width:100%;gap:10px}
.far .node .name{font-size:25px;font-weight:600}
.far .node .dot{width:14px;height:14px}
.far .node.you{font-size:22px}
.far .node .name[data-far]{font-size:0}
.far .node .name[data-far]::after{content:attr(data-far);font-size:25px}
.far .frame span{font-size:22px;top:-16px;padding:0 10px}
.far .node.working{background:color-mix(in srgb,var(--work) 18%,var(--card))}
.far .node.failed{background:color-mix(in srgb,var(--fail) 18%,var(--card))}
.far .node.waiting{background:color-mix(in srgb,var(--wait) 18%,var(--card))}
/* machine frames (agents on another machine) */
#frames{transition:opacity .2s}
.frame{position:absolute;left:0;top:0;border:1px dashed var(--line-hi);border-radius:12px;background:color-mix(in srgb,var(--fg) 2.5%,transparent);pointer-events:none}
.frame span{position:absolute;left:10px;top:-9px;font:10.5px var(--mono);color:var(--mute);background:var(--bg);padding:0 6px}
/* edge label pill */
.elabel{position:absolute;left:0;top:0;transform:translate(-50%,-50%);font-size:11px;line-height:1.3;color:var(--fg);background:var(--bg);
  border:1px solid var(--line);border-radius:4px;padding:2px 7px;max-width:260px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  pointer-events:none;transition:opacity .4s}
.elabel i{display:inline-block;width:6px;height:6px;border-radius:50%;margin-right:6px;vertical-align:1px}

/* panels */
.panel{position:absolute;z-index:4;background:var(--panel);border:1px solid var(--panel-line);border-radius:8px;box-shadow:0 4px 18px rgba(0,0,0,.22)}
#hud{top:12px;left:12px;padding:9px 12px;max-width:calc(100% - 140px);cursor:default}
#hud .r1{display:flex;align-items:center;gap:8px;min-width:0}
#hud h1{margin:0;font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#hud .r2{display:flex;flex-wrap:wrap;align-items:center;gap:4px 10px;margin-top:4px;color:var(--mute);font-size:12px}
#hud .pill{font:10.5px var(--mono);padding:1px 6px;border-radius:999px;border:1px solid var(--line);color:var(--mute);white-space:nowrap}
.live{flex:none;width:7px;height:7px;border-radius:50%;background:var(--faint)}
.live.on{background:var(--done)}
#legend{display:flex;flex-wrap:wrap;gap:2px 10px;margin-top:6px;color:var(--faint);font-size:10.5px}
#legend span{display:inline-flex;align-items:center;gap:4px}#legend i{width:7px;height:7px;border-radius:50%}
#tr{top:12px;right:12px;display:flex;background:none;border:0;box-shadow:none;gap:6px}
button{font:12px var(--sans);background:var(--ctrl);color:var(--fg);border:1px solid var(--ctrl-line);border-radius:6px;padding:5px 11px;cursor:pointer}
button:hover{background:var(--ctrl-hover)}
button:focus-visible{outline:2px solid var(--work);outline-offset:1px}
#controls{left:12px;bottom:12px;display:flex;flex-direction:column;overflow:hidden;border-radius:6px}
#controls button{width:26px;height:26px;padding:0;display:grid;place-items:center;border:0;border-bottom:1px solid var(--ctrl-line);border-radius:0;background:var(--ctrl)}
#controls button:last-child{border-bottom:0}
#controls button:hover{background:var(--ctrl-hover)}
#controls svg{width:12px;height:12px;fill:currentColor}
#minimap{right:12px;bottom:12px;width:184px;height:124px;overflow:hidden;cursor:pointer;display:none}
#minimap.on{display:block}
#minimap svg{width:100%;height:100%;display:block}
#minimap .mm-mask{fill:color-mix(in srgb,var(--bg) 62%,transparent);fill-rule:evenodd}
#err{left:50%;top:12px;transform:translateX(-50%);padding:8px 12px;color:var(--fail);border-color:var(--fail);font:12px var(--mono);display:none}
body.ended .node.working .dot{animation:none;background:var(--done)}
body.ended .node.working{border-color:var(--line)}
#hud .pill.done{color:var(--done);border-color:color-mix(in srgb,var(--done) 45%,var(--line));cursor:pointer}
#hud .pill.escalate{color:var(--wait);border-color:color-mix(in srgb,var(--wait) 45%,var(--line));cursor:pointer}
#done-veil{position:absolute;inset:0;z-index:5;display:none;place-items:center;padding:24px;
  background:color-mix(in srgb,var(--bg) 56%,transparent);backdrop-filter:blur(2px)}
#done-veil.on{display:grid}
#done-card{width:min(440px,100%);background:var(--panel);border:1px solid var(--panel-line);border-radius:12px;
  padding:20px 22px;box-shadow:0 16px 48px rgba(0,0,0,.38);text-align:left}
#done-card .badge{display:inline-flex;align-items:center;gap:7px;font:11px var(--mono);text-transform:uppercase;
  letter-spacing:.05em;padding:3px 9px;border-radius:999px;border:1px solid color-mix(in srgb,var(--done) 45%,var(--line));color:var(--done)}
#done-card .badge i{width:7px;height:7px;border-radius:50%;background:var(--done)}
#done-card.escalate .badge{color:var(--wait);border-color:color-mix(in srgb,var(--wait) 45%,var(--line))}
#done-card.escalate .badge i{background:var(--wait)}
#done-card.neutral .badge{color:var(--mute);border-color:var(--line)}
#done-card.neutral .badge i{background:var(--mute)}
#done-card h2{margin:12px 0 6px;font-size:16px;font-weight:600;line-height:1.35}
#done-card .goal{margin:0 0 12px;color:var(--mute);font-size:12.5px;line-height:1.45}
#done-card .stats{font:11.5px/1.6 var(--mono);color:var(--fg);background:var(--card);border:1px solid var(--line);
  border-radius:8px;padding:8px 10px;margin-bottom:12px}
#done-card .note{font-size:11.5px;color:var(--faint);margin:0 0 14px}
#done-card .actions{display:flex;gap:8px;flex-wrap:wrap}
#done-card .actions button.primary{background:color-mix(in srgb,var(--done) 18%,var(--ctrl));border-color:color-mix(in srgb,var(--done) 45%,var(--ctrl-line))}
#done-card .actions button.primary:hover{background:color-mix(in srgb,var(--done) 28%,var(--ctrl))}

/* inspector */
#inspector{position:fixed;top:0;right:0;bottom:0;width:380px;background:var(--panel);border-left:1px solid var(--panel-line);
  padding:14px 16px 20px;overflow:auto;transform:translateX(100%);transition:transform .25s ease;z-index:6}
body.inspecting #inspector{transform:none}
#inspector .dhead{display:flex;gap:10px;align-items:flex-start}
#inspector h3{margin:0 0 6px;font-size:13.5px;flex:1;min-width:0;line-height:1.35}
#inspector .kv{font:11px/1.6 var(--mono);color:var(--mute)}
#inspector .kv b{font-weight:500;color:var(--fg)}
#inspector .sec{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--faint);margin:14px 0 6px}
#inspector pre{white-space:pre-wrap;word-break:break-word;font:11.5px/1.5 var(--mono);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin:0;max-height:220px;overflow:auto}
#inspector .now{font:12px/1.5 var(--mono);background:var(--card);border:1px solid color-mix(in srgb,var(--work) 40%,var(--line));border-radius:8px;padding:8px 10px;white-space:pre-wrap;word-break:break-word}
#inspector .steps{font:11.5px/1.55 var(--mono);color:var(--mute)}
#inspector .steps div{display:grid;grid-template-columns:64px minmax(0,1fr);gap:8px;padding:2px 0}
#inspector .steps span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--fg)}
@media (max-width:760px){body.inspecting #flow{right:0;bottom:55%}#inspector{top:auto;left:0;width:auto;height:55%;border-left:0;border-top:1px solid var(--panel-line);transform:translateY(100%)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style></head><body>
<div id="flow">
  <div id="vp"><svg id="edges"><g id="edge-g"></g><g id="fx"></g></svg><div id="frames"></div><div id="cards"></div><div id="labels"></div></div>
  <div class="panel" id="hud">
    <div class="r1"><span class="live" id="live"></span><h1 id="title">Swarm</h1></div>
    <div class="r2"><span class="pill" id="runstatus"></span><span id="counts"></span><span id="updated"></span></div>
    <div id="legend">
      <span><i style="background:var(--brief)"></i>brief ↓</span><span><i style="background:var(--msg)"></i>message ↓</span>
      <span><i style="background:var(--result)"></i>result ↑</span><span><i style="background:var(--failure)"></i>failed ↑</span>
      <span><i style="background:var(--prompt)"></i>you ↔ coordinator</span>
      <span id="legend-peer" hidden><i style="background:var(--msg)"></i>lead ↔ lead</span>
    </div>
  </div>
  <div class="panel" id="tr"><button id="replay" type="button" title="Replay this run's messages from the start">▶ Replay</button></div>
  <div class="panel" id="controls">
    <button id="zin" type="button" title="Zoom in" aria-label="Zoom in"><svg viewBox="0 0 32 32"><path d="M32 18.133H18.133V32h-4.266V18.133H0v-4.266h13.867V0h4.266v13.867H32z"/></svg></button>
    <button id="zout" type="button" title="Zoom out" aria-label="Zoom out"><svg viewBox="0 0 32 5"><path d="M0 0h32v4.2H0z"/></svg></button>
    <button id="zfit" type="button" title="Fit to view" aria-label="Fit to view"><svg viewBox="0 0 32 30"><path d="M3.692 4.63c0-.53.4-.938.939-.938h5.215V0H4.708C2.13 0 0 2.054 0 4.63v5.216h3.692V4.631zM27.354 0h-5.2v3.692h5.17c.53 0 .984.4.984.939v5.215H32V4.631A4.624 4.624 0 0027.354 0zm.954 24.83c0 .532-.4.94-.939.94h-5.215v3.768h5.215c2.577 0 4.631-2.13 4.631-4.707v-5.139h-3.692v5.139zm-23.677.94c-.531 0-.939-.4-.939-.94v-5.138H0v5.139c0 2.577 2.13 4.707 4.708 4.707h5.138V25.77H4.631z"/></svg></button>
  </div>
  <div class="panel" id="minimap" title="Click to move the view"><svg id="mm"></svg></div>
  <div class="panel" id="err"></div>
  <div id="done-veil" role="dialog" aria-modal="false" aria-labelledby="done-title">
    <div id="done-card">
      <div class="badge"><i></i><span id="done-badge">Swarm complete</span></div>
      <h2 id="done-title">Swarm complete</h2>
      <p class="goal" id="done-goal"></p>
      <div class="stats" id="done-stats"></div>
      <p class="note">Live viewer stopped · waiting for next swarm (auto-resumes on new run)</p>
      <div class="actions">
        <button id="done-inspect" class="primary" type="button">Inspect graph</button>
        <button id="done-replay" type="button">▶ Replay</button>
      </div>
    </div>
  </div>
</div>
<aside id="inspector" aria-label="Agent details"></aside>
<script>
"use strict";
const $ = (q) => document.querySelector(q);
const NS = "http://www.w3.org/2000/svg";
const REDUCE = matchMedia("(prefers-reduced-motion: reduce)").matches;
const COLORS = { brief: "--brief", message: "--msg", steer: "--msg", result: "--result", failure: "--failure", poll: "--poll", cancel: "--failure", prompt: "--prompt", reply: "--reply", board: "--msg" };
const FLY = new Set(Object.keys(COLORS).filter((k) => k !== "poll" && k !== "cancel"));
const CARD_W = 248, CARD_H = 64, YOU_W = 64, YOU_H = 32, LESS_H = 30, COL_GAP = 76, ROW_GAP = 12, COLLAPSE_AT = 8;
const css = (v) => getComputedStyle(document.documentElement).getPropertyValue(v).trim();

const S = { meta: null, nodes: new Map(), events: [], lastSeq: -1, sel: null, replay: null, connected: false, expanded: new Set(), serverId: null, ended: false, endedAt: null, endDismissed: false };
const V = { x: 0, y: 0, k: 1, user: false };
const cards = new Map(), edges = new Map();
let G = null, L = null, structKey = "";

// ------------------------------------------------------------ small helpers
function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
const setText = (e, t) => { if (e.textContent !== t) e.textContent = t; };
const fmtT = (iso) => iso ? new Date(iso).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit", second: "2-digit" }) : "";
const fmtHM = (iso) => iso ? new Date(iso).toLocaleTimeString([], { hour: "numeric", minute: "2-digit" }) : "";
function dur(ms) { if (!(ms >= 0)) return ""; const s = Math.floor(ms / 1000); if (s < 60) return s + "s"; const m = Math.floor(s / 60); if (m < 60) return m + "m " + (s % 60) + "s"; return Math.floor(m / 60) + "h " + (m % 60) + "m"; }
const modelShort = (m) => String(m || "").replace(/^claude-/, "").replace(/-(\d+)-(\d+)$/, " $1.$2");
const clip = (t, n) => { t = String(t || "").replace(/\s+/g, " ").trim(); return t.length > n ? t.slice(0, n - 1) + "…" : t; };
function nameOf(id) {
  if (id === "you") return "You";
  const n = S.nodes.get(id); if (!n) return "?";
  if (n.role === "coordinator") return "Coordinator";
  if (n.role === "lead") return "Lead";
  return n.ledgerLabel || n.title;
}

// ------------------------------------------------------------ graph: the tree, with finished work folded away under busy parents
function buildGraph() {
  const byId = S.nodes, root = S.meta.root, kids = new Map();
  const add = (p, c) => { if (!kids.has(p)) kids.set(p, []); kids.get(p).push(c); };
  const sorted = [...byId.values()].sort((a, b) => String(a.createdAt).localeCompare(String(b.createdAt)));
  for (const n of sorted) add(n.id === root ? "you" : (n.parentId && byId.has(n.parentId) ? n.parentId : root), n.id);
  const lead = [...sorted].reverse().find((n) => n.role === "lead" && ["working", "delegating", "waiting"].includes(n.status))
    || [...sorted].reverse().find((n) => n.role === "lead");
  const plans = (S.meta.pending || []).map((g, i) => ({ id: `plan:${g.label}:${i}`, plan: true, ...g }));
  const leadOfStream = (st) => st && S.meta.streams?.find((x) => x.name === st)?.leadId;
  for (const g of plans) { const l = leadOfStream(g.stream); add(l && byId.has(l) ? l : lead ? lead.id : root, g.id); }
  const activeMemo = new Map();
  const subtreeActive = (id) => {
    if (activeMemo.has(id)) return activeMemo.get(id);
    activeMemo.set(id, false);
    const st = byId.get(id)?.status;
    let a = st === "working" || st === "delegating" || st === "waiting";
    if (!a) for (const c of kids.get(id) || []) if (subtreeActive(c)) { a = true; break; }
    activeMemo.set(id, a);
    return a;
  };
  const subtreeSel = (id) => id === S.sel || (kids.get(id) || []).some((c) => subtreeSel(c));
  const groups = new Map(), alias = new Map();
  for (const [p, cs] of [...kids]) {
    if (p === "you") continue;
    if (S.expanded.has(p)) { const id = `less:${p}`; groups.set(id, { id, less: true, parent: p }); cs.push(id); continue; }
    const parentFinished = p !== root && (S.ended || (!subtreeActive(p) && !subtreeSel(p)));
    const fold = (pred, kind, label, minCount) => {
      const members = cs.filter(pred);
      if (members.length < minCount) return;
      const id = `grp:${kind}:${p}`;
      groups.set(id, { id, group: true, kind, parent: p, members, label });
      for (const m of members) { alias.set(m, id); cs.splice(cs.indexOf(m), 1); }

  arc.setAttribute("class", "edge peer");
  $("#edge-g").append(arc);
  if (!S.replay) {
    const mid = arc.getPointAtLength(arc.getTotalLength() / 2);
    const d = el("div", "elabel"); const i = el("i"); i.style.background = color;
    d.append(i, document.createTextNode(clip(ev.label, 44))); d.style.left = mid.x - 8 + "px"; d.style.top = mid.y + "px"; d.style.transform = "translate(-100%,-50%)";
    $("#labels").append(d); setTimeout(() => { d.style.opacity = 0; setTimeout(() => d.remove(), 450); }, 2800);
  }
  if (REDUCE) { ping(to, color); setTimeout(() => arc.remove(), 1500); return; }
  const g = document.createElementNS(NS, "g"); g.setAttribute("class", "fx-dot");
  const halo = document.createElementNS(NS, "circle"); halo.setAttribute("r", 7); halo.setAttribute("fill", color); halo.setAttribute("fill-opacity", .22);
  const dot = document.createElementNS(NS, "circle"); dot.setAttribute("r", 3.2); dot.setAttribute("fill", color);
  g.append(halo, dot); $("#fx").append(g);
  const len = arc.getTotalLength(), ms = 1300 / speed, t0 = performance.now();
  (function step(now) {
    const k = Math.min(1, (now - t0) / ms), e = k < .5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2;
    const p = arc.getPointAtLength(e * len); g.setAttribute("transform", `translate(${p.x.toFixed(1)},${p.y.toFixed(1)})`);
    if (k < 1) requestAnimationFrame(step);
    else { g.remove(); ping(to, color); arc.style.transition = "opacity .6s"; arc.style.opacity = 0; setTimeout(() => arc.remove(), 650); }
  })(t0);
}
function pulse(ev, speed = 1) {
  if (!FLY.has(ev.kind) || !ev.to) return;
  if (ev.to === "leads") { for (const n of S.nodes.values()) if (isPeer(ev.from, n.id)) peerPulse(ev.from, n.id, ev, speed); return; }
  if (isPeer(ev.from, ev.to)) { peerPulse(ev.from, ev.to, ev, speed); return; }
  const segs = routeOf(ev.from, ev.to);
  const target = ev.to === "you" || cards.has(ev.to) ? ev.to : G.alias.get(ev.to);
  const color = css(COLORS[ev.kind] || "--msg");
  if (!segs || REDUCE) { ping(target, color); return; }
  const g = document.createElementNS(NS, "g"); g.setAttribute("class", "fx-dot");
  const halo = document.createElementNS(NS, "circle"); halo.setAttribute("r", 7); halo.setAttribute("fill", color); halo.setAttribute("fill-opacity", .22);
  const dot = document.createElementNS(NS, "circle"); dot.setAttribute("r", 3.2); dot.setAttribute("fill", color);
  g.append(halo, dot); $("#fx").append(g);
  const lens = segs.map((s) => s.e.path.getTotalLength()), total = lens.reduce((a, b) => a + b, 0);
  const ms = Math.min(2200, Math.max(900, total * 2.2)) / speed, t0 = performance.now();

  (function step(now) {
    if (segs.some((s) => !s.e.path.isConnected)) { g.remove(); return; }
    const k = Math.min(1, (now - t0) / ms), e = k < .5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2;
    const p = at(e); g.setAttribute("transform", `translate(${p.x.toFixed(1)},${p.y.toFixed(1)})`);
    if (k < 1) requestAnimationFrame(step); else { g.remove(); ping(target, color); }
  })(t0);
  if (!S.replay) edgeLabel(segs[segs.length - 1], ev, color);
}
function edgeLabel(seg, ev, color) {
  const path = seg.e.path, L2 = path.getTotalLength(), p = path.getPointAtLength(L2 / 2);
  const d = el("div", "elabel"); const i = el("i"); i.style.background = color;
  const text = ev.kind === "brief" ? "brief: " + clip(ev.label, 40) : ev.kind === "result" ? "result: " + clip(String(ev.label).replace(/^STATUS:\s*\w+\s*[—:-]?\s*/i, ""), 40) : ev.kind + ": " + clip(ev.label, 40);
  d.append(i, document.createTextNode(text)); d.style.left = p.x + "px"; d.style.top = p.y + "px";
  $("#labels").append(d);
  setTimeout(() => { d.style.opacity = 0; setTimeout(() => d.remove(), 450); }, 2800);
}
const pingUntil = new Map();
function ping(id, color) {
  const c = cards.get(id); if (!c) return;
  pingUntil.set(id, performance.now() + 700); c.e.style.setProperty("--ping", color); paintCard(id, c);
  setTimeout(() => { if ((pingUntil.get(id) || 0) <= performance.now()) { pingUntil.delete(id); const c2 = cards.get(id); if (c2) paintCard(id, c2); } }, 720);
}

// ------------------------------------------------------------ header panel
function paintDoneOverlay() {

  if (!S.ended || S.endDismissed || !S.meta) { veil.classList.remove("on"); return; }
  const m = S.meta, nodes = [...S.nodes.values()], root = S.nodes.get(m.root);
  const st = (m.ledger?.status || "").toUpperCase();
  const isComplete = st === "COMPLETE", isEsc = st === "ESCALATE";
  card.className = isComplete ? "" : isEsc ? "escalate" : "neutral";
  const label = isComplete ? "Swarm complete" : isEsc ? "Swarm escalated" : "Swarm ended";
  setText($("#done-badge"), label);
  setText($("#done-title"), root ? root.title : label);
  const goalEl = $("#done-goal");
  const goal = m.ledger?.goal || "";
  goalEl.hidden = !goal;
  setText(goalEl, goal);
  const doneN = nodes.filter((n) => n.status === "done" || n.status === "working" || n.status === "delegating").length;
  const failN = nodes.filter((n) => n.status === "failed").length;
  const machines = new Set(nodes.map((n) => n.machine).filter(Boolean));
  const firstAt = nodes.reduce((min, n) => (n.createdAt && (!min || n.createdAt < min) ? n.createdAt : min), "");
  const endMs = S.endedAt ? Date.parse(S.endedAt) : Date.now();
  const span = firstAt ? dur(endMs - Date.parse(firstAt)) : "";

    `${doneN} done`,
    failN && `${failN} failed`,
    machines.size && `${machines.size + 1} machines`,

}
$("#done-inspect").onclick = () => { S.endDismissed = true; paintDoneOverlay(); };
$("#done-replay").onclick = () => { S.endDismissed = true; paintDoneOverlay(); $("#replay").click(); };
$("#runstatus").onclick = () => { if (S.ended) { S.endDismissed = false; paintDoneOverlay(); } };
function paintHud() {
  const m = S.meta, nodes = [...S.nodes.values()], root = S.nodes.get(m.root);

  document.title = (root ? root.title + " · " : "") + (S.ended ? "Swarm Done" : "Swarm Live");
  const pill = $("#runstatus");
  const lst = (m.ledger?.status || "").toUpperCase();
  const statusText = S.ended

  setText(pill, statusText);
  pill.className = "pill" + (S.ended ? (lst === "ESCALATE" ? " escalate" : " done") : "");
  const c = (s) => nodes.filter((n) => n.status === s).length;
  const machines = new Set(nodes.map((n) => n.machine).filter(Boolean));
  const workingN = S.ended ? 0 : c("working");
  const doneN = S.ended ? nodes.filter((n) => n.status === "done" || n.status === "working" || n.status === "delegating").length : c("done");
  setText($("#counts"), [`${nodes.length} agents`, workingN && `${workingN} working`, `${doneN} done`, c("failed") && `${c("failed")} failed`, !S.ended && c("waiting") && `${c("waiting")} need you`, !S.ended && m.pending?.length && `${m.pending.length} pending`, machines.size && `${machines.size + 1} machines`].filter(Boolean).join(" · "));
  let last = "";
  for (const n of nodes) for (const t of [n.activity?.ts, n.run?.startedAt, n.run?.completedAt]) if (t && t > last) last = t;
  const lastEv = S.events[S.events.length - 1]; if (lastEv?.ts > last) last = lastEv.ts;
  setText($("#updated"), S.replay ? "replaying " + fmtHM(S.replay.iso) : S.ended && S.endedAt ? "Finished " + fmtHM(S.endedAt) : last ? "Last update " + fmtHM(last) : "");
  $("#live").classList.toggle("on", S.connected && !S.ended && !m.lastError);
  $("#legend-peer").hidden = nodes.filter((n) => n.role === "lead").length < 2;
  const err = $("#err"); err.style.display = m.lastError ? "block" : "none"; setText(err, m.lastError || "");
  paintDoneOverlay();
}

// ------------------------------------------------------------ inspector (tap a card)
let detail = { id: null, data: null, at: 0 };
async function loadDetail(id) {
  try {
    const d = window.__DETAIL ? window.__DETAIL(id) : await (await fetch("/api/node?id=" + encodeURIComponent(id), { cache: "no-store" })).json();
    if (S.sel === id) { detail = { id, data: d, at: Date.now() }; renderInspector(); }
  } catch {}
}
function select(id) {
  S.sel = S.sel === id ? null : id;
  document.body.classList.toggle("inspecting", !!S.sel);
  detail = { id: null, data: null, at: 0 };
  if (S.sel && S.sel !== "you") loadDetail(S.sel);
  S.keepView = true; refresh(true); S.keepView = false;
  // after the panel slides in: keep the zoom and glide the chosen card into view; on close, fit again

}
function renderInspector() {
  const box = $("#inspector");
  const head = el("div", "dhead"), close = el("button", null, "✕"); close.setAttribute("aria-label", "Close"); close.onclick = () => select(S.sel);
  if (S.sel === "you") {
    head.append(el("h3", null, "You"), close);
    const evs = S.events.filter((e) => e.kind === "prompt" || e.kind === "reply").slice(-8).reverse();
    const steps = el("div", "steps"); for (const e of evs) { const r = el("div"); r.append(el("time", null, fmtHM(e.ts)), el("span", null, (e.kind === "prompt" ? "you: " : "coordinator: ") + e.label)); steps.append(r); }
    box.replaceChildren(head, el("div", "sec", "Your messages with the Coordinator"), steps);
    return;
  }
  const n = S.nodes.get(S.sel); if (!n) { select(S.sel); return; }
  if (!S.ended && detail.id === n.id && Date.now() - detail.at > 2000) loadDetail(n.id); // keep it live while open
  const d = detail.id === n.id ? detail.data : null;
  head.append(el("h3", null, (n.ledgerLabel && !n.title.startsWith(n.ledgerLabel) ? n.ledgerLabel + " · " : "") + n.title), close);
  const kvs = el("div", "kv");
  const kv = (k, v) => { if (!v) return; const r = el("div"); r.append(document.createTextNode(k + ": "), el("b", null, v)); kvs.append(r); };

  kv("model", [n.provider, n.model, n.effort].filter(Boolean).join(" · ")); kv("machine", n.machine || (n.remote ? "another machine" : "this machine"));

  if (d?.recent?.length) { const steps = el("div", "steps"); for (const a of d.recent.slice().reverse()) { const row = el("div"); row.append(el("time", null, fmtHM(a.ts)), el("span", null, a.text)); steps.append(row); } parts.push(el("div", "sec", "Recent steps"), steps); }
  const ws = n.stream && S.meta.streams?.find((x) => x.name === n.stream);
  if (ws) {

    for (const c of S.meta.contracts || []) {
      const rel = [c.owner === ws.name || c.owner === "all" ? "builds it" : null, c.by === ws.name ? "proposed" : null, c.acks.includes(ws.name) ? "acked" : null].filter(Boolean);
      if (rel.length) lines.push(`contract #${c.n} (${rel.join(", ")}): ${c.text}`);
    }

  }
  if (d?.lastText) parts.push(el("div", "sec", "Latest message"), el("pre", null, d.lastText));
  if (d?.brief) parts.push(el("div", "sec", n.role === "coordinator" ? "Your first message" : "Brief"), el("pre", null, d.brief));
  if (n.remote) parts.push(el("div", "sec", "Another machine"), el("div", "kv", d?.lastText ? "This agent ran on " + (n.machine || "another machine") + ". Intermediate steps live in that machine's T3; its brief and latest message are shown above." : "This agent runs on " + (n.machine || "another machine") + ". Intermediate steps live in that machine's T3; its final message will appear here when it finishes."));
  const scroll = box.scrollTop; box.replaceChildren(...parts); box.scrollTop = scroll;
}
addEventListener("keydown", (e) => { if (e.key === "Escape" && S.sel) select(S.sel); });

// ------------------------------------------------------------ replay
$("#replay").onclick = () => {
  if (S.replay) { S.replay.stop = true; return; }
  const evs = S.events.filter((e) => FLY.has(e.kind) && e.to);
  if (!evs.length) return;
  const start = [...S.nodes.values()].reduce((m, n) => (n.createdAt && n.createdAt < m ? n.createdAt : m), evs[0].ts);
  const t0 = Date.parse(start), t1 = Date.parse(evs[evs.length - 1].ts);
  const playMs = Math.min(40000, Math.max(8000, evs.length * 300)), rate = Math.max(1, t1 - t0) / playMs;
  S.replay = { iso: start, stop: false }; setText($("#replay"), "■ Stop");
  const began = performance.now(); let i = 0, lastPaint = 0;
  (function step(now) {
    const sim = t0 + (now - began) * rate; S.replay.iso = new Date(sim).toISOString();
    while (i < evs.length && Date.parse(evs[i].ts) <= sim) pulse(evs[i++], 1.6);
    if (now - lastPaint > 150) { lastPaint = now; for (const [id, c] of cards) paintCard(id, c); paintEdgeState(); paintHud(); }
    if (i < evs.length && !S.replay.stop) requestAnimationFrame(step);
    else { S.replay = null; setText($("#replay"), "▶ Replay"); refresh(false); }
  })(began);
};

// ------------------------------------------------------------ data in (v2: summaries once, then only what changed)
function resetForNewRun() {
  if (S.replay) { S.replay.stop = true; S.replay = null; setText($("#replay"), "▶ Replay"); }
  if (S.sel) { S.sel = null; document.body.classList.remove("inspecting"); }
  detail = { id: null, data: null, at: 0 };
  S.expanded.clear();
  pingUntil.clear();
  for (const c of cards.values()) c.e.remove();
  cards.clear();
  for (const e of edges.values()) e.path.remove();
  edges.clear();
  $("#frames").replaceChildren();
  $("#labels").replaceChildren();
  $("#fx").replaceChildren();
  L = null; structKey = ""; V.user = false;
  S.ended = false; S.endedAt = null; S.endDismissed = false;
  document.body.classList.remove("ended");
  $("#done-veil").classList.remove("on");
}
function isDifferentRun(meta) {
  if (!S.meta || !meta) return false;
  if (meta.serverId && S.serverId && meta.serverId !== S.serverId) return true;
  if (meta.root && S.meta.root && meta.root !== S.meta.root) return true;
  if (meta.run && S.meta.run && meta.run !== S.meta.run) return true;
  return false;
}
function applyInit(d) {
  const switched = isDifferentRun(d.meta);
  if (switched) resetForNewRun();
  S.meta = d.meta; S.serverId = d.meta?.serverId || null; S.ended = false; S.endedAt = null; S.endDismissed = false;
  S.nodes = new Map(d.nodes.map((n) => [n.id, n]));
  S.events = d.events.slice().sort((a, b) => a.seq - b.seq); S.lastSeq = S.events.length ? S.events[S.events.length - 1].seq : -1;
  S.connected = true; refresh(switched);
}
function applyTick(d) {
  S.meta = d.meta; S.serverId = d.meta?.serverId || S.serverId; S.connected = true; S.ended = false; S.endedAt = null; S.endDismissed = false;
  for (const u of d.upserts || []) S.nodes.set(u.id, u);
  for (const id of d.removed || []) S.nodes.delete(id);
  refresh(false);
  for (const ev of d.events || []) { if (ev.seq <= S.lastSeq) continue; S.lastSeq = ev.seq; S.events.push(ev); if (!S.replay) pulse(ev); }
}
function connect() {
  let es = null, retryTimer = 0, pollTimer = 0, polling = false;
  const stopPoll = () => { if (pollTimer) { clearTimeout(pollTimer); pollTimer = 0; } };
  const closeEs = () => { if (es) { try { es.close(); } catch {} es = null; } };
  const scheduleReconnect = (delay = 1500) => {
    if (retryTimer) return;
    retryTimer = setTimeout(() => { retryTimer = 0; openStream(); }, delay);
  };
  const poll = async () => {
    pollTimer = 0;
    try {
      let d = await (await fetch("/v2/state?since=" + S.lastSeq, { cache: "no-store" })).json();
      if (!S.meta || isDifferentRun(d.meta)) {
        if (S.lastSeq >= 0) d = await (await fetch("/v2/state?since=-1", { cache: "no-store" })).json();
        applyInit(d);
      } else {
        applyTick({ meta: d.meta, upserts: d.nodes, removed: [...S.nodes.keys()].filter((id) => !d.nodes.some((n) => n.id === id)), events: d.events });
      }
    } catch { S.connected = false; if (S.meta) paintHud(); }
    pollTimer = setTimeout(poll, 1500);
  };
  function openStream() {
    closeEs();
    let got = false;
    try {
      const s = new EventSource("/v2/events");
      es = s;
      const fallback = setTimeout(() => {
        if (!got && es === s && !S.meta) { closeEs(); polling = true; poll(); }
      }, 5000);
      s.addEventListener("init", (m) => {
        if (es !== s) return;
        got = true; polling = false; stopPoll(); clearTimeout(fallback);
        applyInit(JSON.parse(m.data));
      });
      s.addEventListener("tick", (m) => {
        if (es !== s) return;
        got = true; clearTimeout(fallback);
        applyTick(JSON.parse(m.data));
      });
      s.addEventListener("ended", (m) => {
        if (es !== s) return;
        clearTimeout(fallback);
        let payload = null;
        try { payload = m.data ? JSON.parse(m.data) : null; } catch {}
        S.connected = false; S.ended = true; S.endedAt = payload?.endedAt || new Date().toISOString(); S.endDismissed = false;
        if (payload?.ledger && S.meta) S.meta = { ...S.meta, ledger: payload.ledger };
        if (S.meta) refresh(true);
        closeEs();
        scheduleReconnect(1500);
      });
      s.onerror = () => {
        if (es !== s) return;
        clearTimeout(fallback);

        scheduleReconnect(1500);

  }

    if (polling) { stopPoll(); poll(); }
    else if (!S.connected) { if (retryTimer) { clearTimeout(retryTimer); retryTimer = 0; } openStream(); }
  };

}
applyView();
if (window.__INIT) applyInit(window.__INIT); else connect();
setInterval(() => { if (!S.meta || S.replay || S.ended) return; for (const [id, c] of cards) if (c.cls.includes("working")) paintCard(id, c); paintHud(); if (S.sel) renderInspector(); }, 1000);
